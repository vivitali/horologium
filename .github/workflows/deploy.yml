name: Deploy Lambdas

# Manual only: merging to main never touches prod. Run it from
# Actions -> Deploy Lambdas -> Run workflow (on main; the OIDC role is
# locked to refs/heads/main).
on:
  workflow_dispatch:

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for AWS auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy-winnipeg-tech-events
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MEETUP_BOT_TOKEN: ${{ secrets.TELEGRAM_MEETUP_BOT_TOKEN }}
          TELEGRAM_MEETUP_CHAT_ID: ${{ secrets.TELEGRAM_MEETUP_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CITY: ${{ vars.CITY || 'Winnipeg' }}
          CATEGORIES: ${{ vars.CATEGORIES || 'tech' }}
          PERIOD_DAYS: ${{ vars.PERIOD_DAYS || '30' }}
          TEST_MODE: ${{ vars.TEST_MODE || 'false' }}
        run: ./deploy/deploy.sh

      - name: Smoke test (meetup bot, no-op day)
        run: |
          aws lambda invoke \
            --function-name winnipeg-meetup-bot \
            --payload '{"date":"2026-01-02"}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            /tmp/meetup.json
          cat /tmp/meetup.json
          grep -q '"success":true' /tmp/meetup.json
